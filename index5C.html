const CATS = ['단일구조적','다중구조적','관계적'];
const GROUP_LABEL = { '실험집단':'가', '통제집단':'나' };
const CAT_SHORT = { '단일구조적':'단', '다중구조적':'다', '관계적':'관' };

/* ══════════════════════════════════════════
   GAS 통신
══════════════════════════════════════════ */
async function gasPost(body) {
  const res  = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body) });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || '서버 오류');
  return data;
}
async function gasGet(params) {
  const res  = await fetch(`${GAS_URL}?${new URLSearchParams(params).toString()}`);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || '서버 오류');
  return data;
}
async function apiCheck(sid) {
  try { return (await gasGet({ action:'check', sid, tt:TEST_TYPE })).exists; }
  catch { return false; }
}
async function apiGrade(questions, answers) {
  return (await gasPost({ action:'grade', questions, answers })).grades;
}
async function apiSave(result) { return gasPost({ action:'save', ...result }); }
async function apiLoadAll()    { return (await gasGet({ action:'all' })).results; }

/* ══════════════════════════════════════════
   점수 계산
══════════════════════════════════════════ */
function itemScore(q, answers, grades) {
  if (q.type === 'mc') return (answers && answers[q.id] === q.ans) ? q.pts : 0;
  const g = grades && grades[q.id];
  return (g && typeof g.score === 'number') ? g.score : 0;
}
function calcScores(answers, grades) {
  const s = { 단일구조적:0, 다중구조적:0, 관계적:0 };
  QS.forEach(q => { s[q.cat] += itemScore(q, answers, grades); });
  return { ...s, total: s.단일구조적 + s.다중구조적 + s.관계적 };
}

/* ══════════════════════════════════════════
   엑셀 내보내기
══════════════════════════════════════════ */
function forceTextCol(ws, cols, startRow, rowCount) {
  cols.forEach(c => {
    for (let i = 0; i < rowCount; i++) {
      const cell = ws[XLSX.utils.encode_cell({ r:startRow+i, c })];
      if (cell && cell.v !== undefined && cell.v !== null && cell.v !== '') {
        cell.t = 's'; cell.v = String(cell.v); cell.z = '@';
      }
    }
  });
}

const ITEM_HEADER = ['학생ID','집단',
  ...QS.map(q => `문${q.id}(${CAT_SHORT[q.cat]}·${q.pts}점)`),
  '단일구조적','다중구조적','관계적','총점'];

function itemRows(list) {
  return list
    .slice()
    .sort((a,b) => String(a.studentId).localeCompare(String(b.studentId)))
    .map(r => {
      const each = QS.map(q => itemScore(q, r.answers, r.grades));
      const s = r.scores || calcScores(r.answers, r.grades);
      return [r.studentId, r.group, ...each, s.단일구조적, s.다중구조적, s.관계적, s.total];
    });
}

function makeItemSheet(list) {
  const rows = itemRows(list);
  const ws = XLSX.utils.aoa_to_sheet([ITEM_HEADER, ...rows]);
  forceTextCol(ws, [0,1], 1, rows.length);
  ws['!cols'] = ITEM_HEADER.map((_,i) => ({ wch: i===0?14 : i===1?10 : 11 }));
  ws['!freeze'] = { xSplit:2, ySplit:1 };
  return ws;
}

/* ① 문항별 점수 — 집단별 시트 */
function exportItemScores(all) {
  if (!all.length) { alert('내보낼 결과가 아직 없습니다.'); return; }
  const wb = XLSX.utils.book_new();
  ['실험집단','통제집단'].forEach(g => {
    const list = all.filter(r => r.group === g);
    if (list.length) XLSX.utils.book_append_sheet(wb, makeItemSheet(list), `${g}_문항별`);
  });
  XLSX.utils.book_append_sheet(wb, makeItemSheet(all), '전체_문항별');
  XLSX.writeFile(wb, `C형개정본_문항별점수_${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* ② 요약 점수 — 하위영역·총점만 */
function exportSummary(all) {
  if (!all.length) { alert('내보낼 결과가 아직 없습니다.'); return; }
  const H = ['학생ID','집단','단일구조적','다중구조적','관계적','총점','제출일시'];
  const build = list => {
    const rows = list.slice()
      .sort((a,b)=>String(a.studentId).localeCompare(String(b.studentId)))
      .map(r => {
        const s = r.scores || calcScores(r.answers, r.grades);
        return [r.studentId, r.group, s.단일구조적, s.다중구조적, s.관계적, s.total,
                r.timestamp ? new Date(r.timestamp).toLocaleString('ko-KR') : ''];
      });
    const ws = XLSX.utils.aoa_to_sheet([H, ...rows]);
    forceTextCol(ws, [0,1], 1, rows.length);
    ws['!cols'] = [{wch:14},{wch:10},{wch:12},{wch:12},{wch:10},{wch:9},{wch:20}];
    return ws;
  };
  const wb = XLSX.utils.book_new();
  ['실험집단','통제집단'].forEach(g => {
    const list = all.filter(r => r.group === g);
    if (list.length) XLSX.utils.book_append_sheet(wb, build(list), g);
  });
  XLSX.utils.book_append_sheet(wb, build(all), '전체');
  XLSX.writeFile(wb, `C형개정본_요약점수_${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* ③ 서술형 채점 신뢰도 — AI 채점 + 교사 채점 빈칸 (ICC용) */
function exportEssayReliability(all) {
  if (!all.length) { alert('내보낼 결과가 아직 없습니다.'); return; }
  const ids = QS.filter(q => q.type === 'essay').map(q => q.id);
  const H1 = ['학생ID','집단', ...ids.flatMap(id => [`문${id}`,'']), '서술형합계_AI','서술형합계_교사'];
  const H2 = ['','', ...ids.flatMap(() => ['AI채점(1)','교사채점(2)']), '',''];
  const merges = ids.map((_,i) => ({ s:{r:0,c:2+i*2}, e:{r:0,c:3+i*2} }));
  [0,1].forEach(c => merges.push({ s:{r:0,c}, e:{r:1,c} }));
  const last = 2 + ids.length*2;
  merges.push({ s:{r:0,c:last}, e:{r:1,c:last} });
  merges.push({ s:{r:0,c:last+1}, e:{r:1,c:last+1} });

  const rows = all.slice()
    .sort((a,b)=>String(a.studentId).localeCompare(String(b.studentId)))
    .map(r => {
      const ai = ids.map(id => (r.grades && r.grades[id]) ? r.grades[id].score : '');
      const paired = ids.flatMap((_,i) => [ai[i], '']);
      const sum = ai.reduce((s,v) => s + (typeof v==='number'?v:0), 0);
      return [r.studentId, r.group, ...paired, sum, ''];
    });

  const ws = XLSX.utils.aoa_to_sheet([H1, H2, ...rows]);
  forceTextCol(ws, [0,1], 2, rows.length);
  ws['!merges'] = merges;
  ws['!cols'] = [{wch:14},{wch:10}, ...ids.flatMap(()=>[{wch:11},{wch:11}]), {wch:15},{wch:15}];

  /* 답안 원문 시트 — 교사가 보고 채점할 수 있도록 */
  const AH = ['학생ID','집단','문항','학생 답안','AI 점수','AI 피드백'];
  const arows = [];
  all.slice().sort((a,b)=>String(a.studentId).localeCompare(String(b.studentId))).forEach(r => {
    ids.forEach(id => {
      const g = r.grades && r.grades[id];
      arows.push([r.studentId, r.group, `문${id}`,
        (r.answers && r.answers[id]) || '', g ? g.score : '', g ? (g.feedback||'') : '']);
    });
  });
  const ws2 = XLSX.utils.aoa_to_sheet([AH, ...arows]);
  forceTextCol(ws2, [0,1,2], 1, arows.length);
  ws2['!cols'] = [{wch:14},{wch:10},{wch:8},{wch:60},{wch:9},{wch:50}];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws,  '서술형_채점자간신뢰도');
  XLSX.utils.book_append_sheet(wb, ws2, '서술형_답안원문');
  XLSX.writeFile(wb, `C형개정본_서술형채점_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function Exam({ studentId, group, onDone }) {
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [busy, setBusy] = useState(false);
  const [prog, setProg] = useState(0);
  const [progMsg, setProgMsg] = useState('');
  const q = QS[idx];
  const allDone = QS.every(x => x.type === 'mc'
    ? answers[x.id] !== undefined
    : (answers[x.id] || '').trim().length > 0);

  const setAns = (id, v) => setAnswers(p => ({...p, [id]: v}));

  const submit = async () => {
    setBusy(true);
    const essays = QS.filter(x => x.type === 'essay');
    const essayAnswers = {};
    essays.forEach(x => { essayAnswers[x.id] = answers[x.id] || ''; });

    setProg(15); setProgMsg('서술형 답안을 채점하고 있어요');
    let grades = {}, gradeFailed = false;
    try {
      grades = await apiGrade(essays.map(x=>({id:x.id, q:x.q, model:x.model, keys:x.keys})), essayAnswers);
    } catch (err) {
      console.error('채점 오류:', err);
      gradeFailed = true;
      essays.forEach(x => { grades[x.id] = { score:0, feedback:'채점 실패 — 선생님이 직접 채점합니다.' }; });
    }

    setProg(70); setProgMsg('점수를 모으고 있어요');
    const scores = calcScores(answers, grades);

    setProg(88); setProgMsg('결과를 저장하고 있어요');
    let saveFailed = false;
    try {
      await apiSave({ studentId, group, testType:TEST_TYPE, examLabel:TEST_LABEL,
                      scores, answers, grades, timestamp:Date.now() });
    } catch (err) { console.error('저장 오류:', err); saveFailed = true; }

    setProg(100);
    onDone({ studentId, group, answers, grades, scores, gradeFailed, saveFailed });
  };

  if (busy) {
    return (
      <div className="page" style={{maxWidth:480,margin:'0 auto',paddingTop:'5rem',textAlign:'center'}}>
        <div style={{fontSize:44,marginBottom:20}}>📝</div>
        <h2 style={{fontSize:19,fontWeight:700,marginBottom:24}}>{progMsg}</h2>
        <div className="progress-bar" style={{marginBottom:12}}>
          <div className="progress-fill" style={{width:`${prog}%`}}/>
        </div>
        <p style={{fontSize:13,color:'#94a3b8'}}>창을 닫지 말고 잠시 기다려 주세요.</p>
      </div>
    );
  }

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,fontSize:13,color:'#64748b'}}>
        <span>{studentId} · {GROUP_LABEL[group]}</span>
        <span>{idx+1} / {QS.length}</span>
      </div>
      <div className="progress-bar" style={{marginBottom:22}}>
        <div className="progress-fill" style={{width:`${(idx+1)/QS.length*100}%`}}/>
      </div>

      <div className="card" style={{marginBottom:20}}>
        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:14}}>
          <span className={`badge badge-${q.cat}`}>{q.cat}</span>
          <span style={{fontSize:12,color:'#94a3b8'}}>{q.pts}점</span>
        </div>
        <p style={{fontSize:17,fontWeight:600,lineHeight:1.6,marginBottom:18}}>문 {q.id}. {q.q}</p>

        {q.type === 'mc' ? (
          q.opts.map((o,i) => (
            <button key={i}
              className={`opt-btn ${answers[q.id]===i+1?'selected':''}`}
              onClick={()=>setAns(q.id, i+1)}>
              {['①','②','③','④'][i]} {o}
            </button>
          ))
        ) : (
          <div>
            <textarea placeholder="자신의 생각을 문장으로 써 보세요."
              value={answers[q.id]||''} onChange={e=>setAns(q.id, e.target.value)}/>
            <p style={{fontSize:12,color:'#94a3b8',marginTop:8}}>
              {(answers[q.id]||'').trim().length}자 · 배운 낱말을 써서 까닭까지 설명하면 좋아요.
            </p>
          </div>
        )}
      </div>

      <div style={{display:'flex',gap:8}}>
        <button className="btn" style={{flex:1,padding:'14px'}} disabled={idx===0}
                onClick={()=>setIdx(i=>i-1)}>← 이전</button>
        {idx < QS.length-1
          ? <button className="btn btn-blue" style={{flex:2,padding:'14px'}}
                    onClick={()=>setIdx(i=>i+1)}>다음 →</button>
          : <button className="btn btn-green" style={{flex:2,padding:'14px'}}
                    disabled={!allDone} onClick={submit}>
              {allDone ? '답안 제출하기' : '안 푼 문제가 있어요'}
            </button>}
      </div>

      <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:22}}>
        {QS.map((x,i) => {
          const done = x.type==='mc' ? answers[x.id]!==undefined : (answers[x.id]||'').trim().length>0;
          return (
            <button key={x.id} onClick={()=>setIdx(i)}
              style={{width:36,height:36,borderRadius:8,fontSize:13,cursor:'pointer',fontFamily:'inherit',
                      border:`1.5px solid ${i===idx?'#22c55e':'rgba(0,0,0,0.12)'}`,
                      background: done ? '#f0fdf4' : '#fff',
                      fontWeight: i===idx?700:400, color:'#111'}}>{x.id}</button>
          );
        })}
      </div>
    </div>
  );
}

function Teacher({ onBack }) {

    } catch (e) { setErr('결과를 불러오지 못했습니다. ' + e.message); }

  };
  useEffect(() => { if (ok) load(); }, [ok]);

  if (!ok) {
    return (

        <button className="btn" style={{marginBottom:24,fontSize:13}} onClick={onBack}>← 처음으로</button>

               style={{marginBottom:14}}/>
        <button className="btn btn-green" style={{width:'100%',padding:'14px'}}

          들어가기
        </button>
      </div>
    );
  }

  const shown = filter==='전체' ? all : all.filter(r=>r.group===filter);
  const stat = g => {
    const list = g==='전체' ? all : all.filter(r=>r.group===g);
    if (!list.length) return null;
    const m = k => (list.reduce((s,r)=>s+((r.scores||calcScores(r.answers,r.grades))[k]||0),0)/list.length).toFixed(1);
    return { n:list.length, total:m('total'), 단:m('단일구조적'), 다:m('다중구조적'), 관:m('관계적') };

  return (
    <div className="page">

        <button className="btn btn-excel" onClick={()=>exportItemScores(all)}>문항별 점수 (집단별)</button>
        <button className="btn btn-excel2" onClick={()=>exportSummary(all)}>요약 점수</button>
        <button className="btn btn-blue" onClick={()=>exportEssayReliability(all)}>서술형 채점표</button>
        <button className="btn" onClick={load} disabled={loading}>{loading?'불러오는 중...':'새로고침'}</button>
      </div>

      {err && <div className="warn" style={{marginBottom:16}}>{err}</div>}

      <div className="card" style={{marginBottom:18}}>
        <h3 style={{fontSize:15,fontWeight:700,marginBottom:12}}>집단별 평균</h3>
        <table>
          <thead><tr><th>집단</th><th className="sc">인원</th><th className="sc">단일구조적</th>
            <th className="sc">다중구조적</th><th className="sc">관계적</th><th className="sc">총점</th></tr></thead>
          <tbody>
            {['실험집단','통제집단','전체'].map(g => {
              const s = stat(g); if (!s) return null;
              return (<tr key={g}>
                <td style={{fontWeight:600}}>{g}</td><td className="sc">{s.n}</td>
                <td className="sc">{s.단}</td><td className="sc">{s.다}</td>
                <td className="sc">{s.관}</td><td className="sc">{s.total}</td>
              </tr>);
            })}
          </tbody>
        </table>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:12}}>
        {['전체','실험집단','통제집단'].map(g=>(
          <button key={g} className={`btn ${filter===g?'btn-blue':''}`} style={{fontSize:13,padding:'8px 14px'}}
                  onClick={()=>setFilter(g)}>{g}</button>
        ))}
      </div>

      <div className="card" style={{overflowX:'auto'}}>
        <table>
          <thead><tr>
            <th>학생ID</th><th>집단</th>
            {QS.map(q=><th key={q.id} className="sc">{q.id}</th>)}
            <th className="sc">총점</th>
          </tr></thead>
          <tbody>
            {shown.slice().sort((a,b)=>String(a.studentId).localeCompare(String(b.studentId))).map((r,i) => {
              const s = r.scores || calcScores(r.answers, r.grades);
              return (
                <tr key={i}>
                  <td style={{fontWeight:600}}>{r.studentId}</td>
                  <td style={{fontSize:12,color:'#64748b'}}>{r.group}</td>
                  {QS.map(q => {
                    const sc = itemScore(q, r.answers, r.grades);
                    return <td key={q.id} className="sc"
                      style={{color: sc===q.pts?'#166534' : sc===0?'#b91c1c':'#92400e'}}>{sc}</td>;
                  })}
                  <td className="sc">{s.total}</td>
                </tr>
              );
            })}
            {!shown.length && <tr><td colSpan={QS.length+3} style={{textAlign:'center',color:'#94a3b8',padding:'24px'}}>
              아직 제출된 결과가 없습니다.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   앱
══════════════════════════════════════════ */
function App() {
  const [view, setView] = useState('home');
  const [session, setSession] = useState(null);
  const [result, setResult] = useState(null);

  if (view === 'login')   return <StudentLogin onBack={()=>setView('home')} onNext={s=>{setSession(s);setView('exam');}}/>;
  if (view === 'exam')    return <Exam {...session} onDone={r=>{setResult(r);setView('result');}}/>;
  if (view === 'result')  return <StudentResult result={result} onHome={()=>{setResult(null);setSession(null);setView('home');}}/>;
  if (view === 'teacher') return <Teacher onBack={()=>setView('home')}/>;
  return <Home onStudent={()=>setView('login')} onTeacher={()=>setView('teacher')}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
